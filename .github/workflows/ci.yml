name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests and coverage
        run: pytest --cov=logwarden --cov-report=term --cov-fail-under=80
      - name: Demo
        run: logwarden demo

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Static analysis (bandit)
        run: bandit -r src -ll
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit --skip-editable